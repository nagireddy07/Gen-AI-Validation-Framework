# ── Azure OpenAI (judge model) ─────────────────────────────────────────────
azure.endpoint=endpoint
azure.api.key=api_key
azure.deployment=gpt-4.1-mini
azure.api.version=2024-12-01-preview

# ── Files ────────────────────────────────────────────────────────────────
# Input: must have header row Query | Expected_Response | Actual_Response
input.excel.path=src/test/resources/input/AI_Test_Data.xlsx
output.excel.path=test-output/AI_Validation_Results.xlsx

# ── Scoring ──────────────────────────────────────────────────────────────
# A query PASSES when Overall_Confidence >= this value (0-100)
pass.threshold=75

# ── Retry ────────────────────────────────────────────────────────────────
max.retries=5
base.backoff.ms=1000
max.backoff.ms=30000
